version: "3.8"

services:
  face-recognition-service:
    build: .
    ports:
      - "8001:8001"
    environment:
      - SERVICE_PORT=8001
      - HOST=0.0.0.0
      - CONFIDENCE_THRESHOLD=0.6
      - FACE_ENCODINGS_DIR=/app/face_encodings
      - DEBUG=true
    volumes:
      - ./face_encodings:/app/face_encodings
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
