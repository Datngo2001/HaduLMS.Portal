version: "3.8"

services:
  backend:
    image: datngo2001/hadu-lms-backend:latest
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACE_RECOGNITION_SERVICE_URL: http://face-recognition-service:8001
    depends_on:
      - face-recognition-service

  face-recognition-service:
    image: datngo2001/hadu-lms-face-service:latest
    environment:
      SERVICE_PORT: 8001
      HOST: 0.0.0.0
      CONFIDENCE_THRESHOLD: 0.6
      FACE_ENCODINGS_DIR: /app/face_encodings
      DEBUG: "true"

  frontend:
    image: datngo2001/hadu-lms-frontend:latest
    depends_on:
      - backend
