services:
  backend:
    build: ./backend
    ports:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FACE_RECOGNITION_SERVICE_URL=http://face-recognition-service:8001
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - face-recognition-service
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  face-recognition-service:
    build: ./face-service
    # Remove external port exposure - only accessible via Docker network
    expose:
      - "8001"
    environment:
      - SERVICE_PORT=8001
      - HOST=0.0.0.0
      - CONFIDENCE_THRESHOLD=0.6
      - FACE_ENCODINGS_DIR=/app/face_encodings
      - DEBUG=true
      - ALLOWED_HOSTS=backend # Only allow backend to access
    volumes:
      - ./face-service/face_encodings:/app/face_encodings
      - ./face-service/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - face-recognition-service
    restart: unless-stopped
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - TUNNEL_ORIGIN_SERVER_NAME=nginx

networks:
  app-network:
    driver: bridge
